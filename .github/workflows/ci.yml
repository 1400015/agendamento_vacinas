name: CI
on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Lisbon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxe (node --check)
        run: |
          node --check servidor.js
          node --check restaurar.js
          node --check testes.js
          node --check testes-cliente.js
          node --check public/app.js
          for f in src/*.js; do node --check "$f"; done
      - name: Testes de interface do cliente (sem servidor)
        run: node testes-cliente.js
      - name: Bateria de testes (API)
        run: |
          # servidor e bateria no MESMO passo: processos de fundo de passos
          # anteriores não sobrevivem de forma fiável entre passos no runner
          node servidor.js 18090 &
          SRV=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18090/api/estado >/dev/null && break
            sleep 1
          done
          node testes.js
          RC=$?
          kill $SRV 2>/dev/null || true
          exit $RC
